/* ── ACTIONS — all text inputs use onchange/onblur, NOT oninput, to avoid re-render mid-type ── */
function setActive(id){AID=id;VIEW="file";TAB="overview";render();save();}
function swTab(t){TAB=t;rMain();}

function sendBulkAgentUpdates(){
  // Group active transactions by agent
  const activeTXS=TXS.filter(t=>!t.funded?.done&&!t.cancellation?.cancelled);
  if(!activeTXS.length){alert("No active transactions found.");return;}

  // Build agent → transactions map
  const agentMap={};
  activeTXS.forEach(tx=>{
    const agInfo=LRG.agents[tx.agent]||{};
    const key=tx.agent||"Unknown Agent";
    if(!agentMap[key])agentMap[key]={agent:tx.agent||"",agentEmail:tx.agentEmail||agInfo.email||"",txs:[]};
    agentMap[key].txs.push(tx);
  });

  const agents=Object.values(agentMap);
  if(!agents.length){alert("No transactions with agents found.");return;}

  // Build one email body per agent with all their transactions
  function buildAgentBody(agentName,agentEmail,txList){
    const firstName=agentName?agentName.split(" ")[0]:"";
    const lines=[];
    lines.push(firstName?`Hi ${firstName},`:"Hi,");
    lines.push("");
    lines.push(`Here's your transaction update for all ${txList.length} active file${txList.length!==1?"s":""} — ${new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}:`);

    txList.forEach(tx=>{
      const addr=tx.address||"(address)";
      const client=allClientNames(tx);
      const coe=tx.coeDate?fmtShort(tx.coeDate):"TBD";
      const coeDays=tx.coeDate?daysUntil(tx.coeDate):null;
      const coeLine=coeDays!==null?(coeDays<0?`${Math.abs(coeDays)}d past COE — please advise`:coeDays===0?"COE TODAY":coeDays<=7?`${coeDays}d to COE`:`${coeDays}d to COE`):"";
      const prog=progTx(tx);

      lines.push("");
      lines.push("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");
      lines.push(`📋 ${addr}${client?" ("+client+")":""}`);
      lines.push(`   COE: ${coe}${coeLine?" — "+coeLine:""}  |  Progress: ${prog}%`);
      if(tx.dashNote){lines.push(`   📝 Notes: ${tx.dashNote}`);}
      const myTodosB=(tx.todos||[]).filter(t=>(t.owner||"me")==="me"&&!t.done);
      if(myTodosB.length){lines.push(`   IN PROGRESS ON MY END:`);myTodosB.forEach(t=>lines.push(`   ✓ ${t.text}`));}
      const agTodos=(tx.todos||[]).filter(t=>t.owner==="agent"&&!t.done);
      if(agTodos.length){lines.push(`   ACTION REQUIRED FROM YOU:`);agTodos.forEach(t=>lines.push(`   → ${t.text}`));}

      // Urgent items
      const urgentConts=[];
      if(tx.acceptDate){
        const acceptDt=new Date(tx.acceptDate+"T00:00:00");
        RPA_PERIODS.filter(p=>p.type==="contingency"||p.id==="buyer_disclosures_review").forEach(p=>{
          if((tx.waivedPeriods||{})[p.id])return;
          if((tx.periodDone||{})[p.id]?.done)return;
          const overrideDate=(tx.periodDates||{})[p.id];
          const overrideStart=(tx.periodStarts||{})[p.id];
          let endD;
          if(overrideDate){endD=new Date(overrideDate+"T00:00:00");}
          else{let startD=new Date(acceptDt);if(overrideStart)startD=new Date(overrideStart+"T00:00:00");endD=new Date(startD);endD.setDate(endD.getDate()+(tx.periods[p.id]??p.defaultDays));}
          const d=daysUntil(toYMD(endD));
          if(d!==null&&d<=14&&d>=0){urgentConts.push(`   ⚠ ${p.name} — ${d===0?"expires TODAY":d===1?"expires tomorrow":"expires "+fmtShort(toYMD(endD))+" ("+d+"d)"}`);}
          else if(d!==null&&d<0){urgentConts.push(`   ⚠ ${p.name} — EXPIRED ${fmtShort(toYMD(endD))} — action needed`);}
        });
      }
      const blocked=allMS(tx).filter(m=>(tx.milestones[m.id]||{}).status==="blocked").map(m=>`   🔴 BLOCKED: ${m.label}`);
      const openRR=(tx.rrList||[]).filter(r=>r.status!=="Accepted"&&r.status!=="Completed"&&r.status!=="Withdrawn").map(r=>`   🔧 RR: ${r.rrType||""}${r.item?" — "+r.item:""}${r.amount?" ($"+r.amount+")":""}${r.status?" — "+r.status:""}`);

      if(urgentConts.length||blocked.length||openRR.length){
        lines.push("   NEEDS ATTENTION:");
        [...urgentConts,...blocked,...openRR].forEach(l=>lines.push(l));
      }

      // Next steps
      const nextSteps=allMS(tx).filter(m=>{const ms=tx.milestones[m.id];return ms&&ms.status==="pending"&&ms.dueDate;})
        .sort((a,b)=>(daysUntil(tx.milestones[a.id].dueDate)||999)-(daysUntil(tx.milestones[b.id].dueDate)||999))
        .slice(0,3).map(m=>{
          const ms=tx.milestones[m.id];const d=daysUntil(ms.dueDate);
          return`   → ${m.label} — ${fmtShort(ms.dueDate)}${d===0?" (TODAY)":d===1?" (tomorrow)":d!==null?" ("+d+"d)":""}`;
        });
      if(nextSteps.length){lines.push("   NEXT:");nextSteps.forEach(l=>lines.push(l));}
    });

    lines.push("");lines.push("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");
    lines.push("");lines.push("Please let me know if you have any questions.");
    lines.push("");lines.push("Best,");lines.push(LRG.tcName);lines.push("TC | Landon Realty Group");lines.push(LRG.tcEmail);
    return lines.join("\n");
  }

  // Build the modal with tabs per agent
  let selectedAgent=0;
  const bodies=agents.map(a=>buildAgentBody(a.agent,a.agentEmail,a.txs));

  const modal=document.createElement("div");
  modal.style.cssText="position:fixed;inset:0;background:rgba(50,40,20,.5);display:flex;align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(6px)";

  function renderModal(){
    const a=agents[selectedAgent];
    const tabsHtml=agents.map((ag,i)=>`<button data-idx="${i}" style="padding:6px 12px;font-size:10px;font-family:'Lato',sans-serif;font-weight:700;border:none;border-radius:20px;cursor:pointer;white-space:nowrap;background:${i===selectedAgent?"#3a3020":"transparent"};color:${i===selectedAgent?"#f5f0e8":"#8a7a60"}">${ag.agent||"Unknown"} (${ag.txs.length})</button>`).join("");

    modal.innerHTML=`<div style="background:#faf7f2;border:1px solid #e0d8c8;border-radius:16px;padding:24px;width:640px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 40px rgba(0,0,0,.15)">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:#2a2010">✉ Email All Agents</span>
        <button id="bulk-close" style="background:none;border:none;color:#a09880;font-size:20px;cursor:pointer;line-height:1">×</button>
      </div>
      <div style="font-size:10px;color:#a09880">${agents.length} agent${agents.length!==1?"s":""} · ${activeTXS.length} active file${activeTXS.length!==1?"s":""} · one email per agent with all their listings</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;background:#f0ebe0;border-radius:20px;padding:4px">${tabsHtml}</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div><label style="font-size:9px;color:#8a7a60;font-weight:700;letter-spacing:1.5px;display:block;margin-bottom:3px">TO</label>
          <input id="bulk-to" value="${esc(a.agentEmail)}" placeholder="Agent email…" style="width:100%;background:#f5f0e8;border:1px solid #d8d0c0;border-radius:7px;padding:7px 10px;font-family:'Lato',sans-serif;font-size:12px;color:#3a3020"/>
        </div>
        <div><label style="font-size:9px;color:#8a7a60;font-weight:700;letter-spacing:1.5px;display:block;margin-bottom:3px">SUBJECT</label>
          <input id="bulk-subj" value="${esc("Transaction Update — "+new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}))}" style="width:100%;background:#f5f0e8;border:1px solid #d8d0c0;border-radius:7px;padding:7px 10px;font-family:'Lato',sans-serif;font-size:12px;color:#3a3020"/>
        </div>
        <div><label style="font-size:9px;color:#8a7a60;font-weight:700;letter-spacing:1.5px;display:block;margin-bottom:3px">MESSAGE</label>
          <textarea id="bulk-body" style="width:100%;min-height:240px;background:#f5f0e8;border:1px solid #d8d0c0;border-radius:7px;padding:10px 12px;font-family:'Lato',sans-serif;font-size:11px;color:#3a3020;line-height:1.6;resize:vertical">${esc(bodies[selectedAgent])}</textarea>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="bulk-mailto" style="flex:1;background:#3a3020;color:#f5f0e8;border:none;border-radius:20px;padding:10px 20px;font-size:11px;font-family:'Lato',sans-serif;font-weight:700;cursor:pointer">✉ Open in Email App</button>
        <button id="bulk-copy" style="flex:1;background:transparent;color:#8a7a60;border:1px solid #d0c8b8;border-radius:20px;padding:10px 20px;font-size:11px;font-family:'Lato',sans-serif;font-weight:700;cursor:pointer">📋 Copy</button>
        <button id="bulk-close2" style="background:transparent;color:#a09880;border:1px solid #d0c8b8;border-radius:20px;padding:10px 16px;font-size:11px;font-family:'Lato',sans-serif;cursor:pointer">Cancel</button>
      </div>
    </div>`;

    const close=()=>document.body.removeChild(modal);
    modal.querySelector("#bulk-close").addEventListener("click",close);
    modal.querySelector("#bulk-close2").addEventListener("click",close);
    modal.addEventListener("click",e=>{if(e.target===modal)close();});

    // Agent tab switching — save current edits before switching
    modal.querySelectorAll("[data-idx]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        bodies[selectedAgent]=modal.querySelector("#bulk-body").value;
        selectedAgent=parseInt(btn.dataset.idx);
        renderModal();
      });
    });

function sendAgentUpdate(tid){
  const tx=TXS.find(t=>t.id===tid);if(!tx)return;
  const agInfo=LRG.agents[tx.agent]||{};
  const agEmail=tx.agentEmail||agInfo.email||"";
  const agName=tx.agent||"";
  const addr=tx.address||"(address)";
  const client=allClientNames(tx);
  const coe=tx.coeDate?fmtShort(tx.coeDate):"TBD";
  const coeDays=tx.coeDate?daysUntil(tx.coeDate):null;
  const coeLine=coeDays!==null?(coeDays<0?`${Math.abs(coeDays)} days past COE — please advise`:coeDays===0?"COE is TODAY":coeDays<=7?`${coeDays} days to COE`:`${coeDays} days to COE`):"";
  const prog=progTx(tx);
  const rep=tx.represent==="buyer"?"Buyer":"Seller";
  const firstName=agName?agName.split(" ")[0]:"";

  // ── WHAT'S DONE ──
  const doneMilestones=allMS(tx).filter(m=>{
    const ms=tx.milestones[m.id];
    return ms&&ms.status==="done";
  }).map(m=>m.label);

  // Done contingencies
  const doneConts=[];
  if(tx.acceptDate){
    RPA_PERIODS.filter(p=>p.type==="contingency").forEach(p=>{
      if((tx.waivedPeriods||{})[p.id])doneConts.push(p.name+" (waived)");
      else if((tx.periodDone||{})[p.id]?.done)doneConts.push(p.name+" — removed");
    });
  }

  // ── IN PROGRESS ──
  const inProgress=allMS(tx).filter(m=>{
    const ms=tx.milestones[m.id];
    return ms&&ms.status==="in_progress";
  }).map(m=>m.label);

  // ── NEEDS THEIR ATTENTION ──
  // Contingencies expiring soon
  const urgentConts=[];
  if(tx.acceptDate){
    const acceptDt=new Date(tx.acceptDate+"T00:00:00");
    RPA_PERIODS.filter(p=>p.type==="contingency"||p.id==="buyer_disclosures_review").forEach(p=>{
      if((tx.waivedPeriods||{})[p.id])return;
      if((tx.periodDone||{})[p.id]?.done)return;
      const overrideDate=(tx.periodDates||{})[p.id];
      const overrideStart=(tx.periodStarts||{})[p.id];
      let endD;
      if(overrideDate){endD=new Date(overrideDate+"T00:00:00");}
      else{
        let startD=new Date(acceptDt);
        if(overrideStart)startD=new Date(overrideStart+"T00:00:00");
        endD=new Date(startD);endD.setDate(endD.getDate()+(tx.periods[p.id]??p.defaultDays));
      }
      const d=daysUntil(toYMD(endD));
      if(d!==null&&d<=14&&d>=0){
        const urgTag=d===0?" — EXPIRES TODAY":d===1?" — expires tomorrow":` — expires ${fmtShort(toYMD(endD))} (${d} days)`;
        urgentConts.push(p.name+urgTag);
      } else if(d!==null&&d<0){
        urgentConts.push(p.name+` — EXPIRED ${fmtShort(toYMD(endD))} — action needed`);
      }
    });
  }

  // Blocked milestones
  const blocked=allMS(tx).filter(m=>{
    const ms=tx.milestones[m.id];
    return ms&&ms.status==="blocked";
  }).map(m=>{
    const ms=tx.milestones[m.id];
    return m.label+(ms.notes?` — ${ms.notes}`:"");
  });

  // Open RR
  const openRR=(tx.rrList||[]).filter(r=>r.status!=="Accepted"&&r.status!=="Completed"&&r.status!=="Withdrawn");

  // Pending CR
  const pendingCR=(tx.crList||[]).filter(r=>r.status==="Pending"||r.status==="Sent");

  // ── NEXT STEPS ──
  // Pending milestones due soonest
  const nextSteps=allMS(tx).filter(m=>{
    const ms=tx.milestones[m.id];
    return ms&&ms.status==="pending"&&ms.dueDate;
  }).sort((a,b)=>{
    const da=daysUntil(tx.milestones[a.id].dueDate)||999;
    const db=daysUntil(tx.milestones[b.id].dueDate)||999;
    return da-db;
  }).slice(0,5).map(m=>{
    const ms=tx.milestones[m.id];
    const d=daysUntil(ms.dueDate);
    return m.label+(ms.dueDate?` — ${fmtShort(ms.dueDate)}${d===0?" (TODAY)":d===1?" (tomorrow)":d!==null?" ("+d+" days)":""}`:"")+
      (ms.notes?`\n     Note: ${ms.notes}`:"");
  });

  // ── BUILD EMAIL ──
  const lines=[];
  lines.push(firstName?`Hi ${firstName},`:"Hi,");
  lines.push("");
  lines.push(`Here's your transaction update for ${addr}${client?` (${client})`:""}:`);
  lines.push(`COE: ${coe}${coeLine?" — "+coeLine:""}`);
  lines.push(`Overall Progress: ${prog}%`);

  // Include file notes if any
  if(tx.dashNote){
    lines.push("");
    lines.push("NOTES");
    lines.push("─────────────────────────────");
    lines.push(tx.dashNote);
  }

  // Agent to-do items
  const agentTodos=(tx.todos||[]).filter(t=>t.owner==="agent"&&!t.done);
  if(agentTodos.length){
    lines.push("");
    const myTodosS=(tx.todos||[]).filter(t=>(t.owner||"me")==="me"&&!t.done);
  if(myTodosS.length){
    lines.push("");
    lines.push("IN PROGRESS ON MY END");
    lines.push("─────────────────────────────");
    myTodosS.forEach(t=>lines.push(`✓  ${t.text}`));
  }
  lines.push("ACTION REQUIRED FROM YOU");
    lines.push("─────────────────────────────");
    agentTodos.forEach(t=>lines.push(`→  ${t.text}`));
  }


  // What's been completed
  const completedItems=[...doneConts,...doneMilestones.slice(0,6)];
  if(completedItems.length){
    lines.push("");
    lines.push("COMPLETED");
    lines.push("─────────────────────────────");
    completedItems.forEach(l=>lines.push(`✓  ${l}`));
  }

  // In progress
  if(inProgress.length){
    lines.push("");
    lines.push("IN PROGRESS");
    lines.push("─────────────────────────────");
    inProgress.forEach(l=>lines.push(`⟳  ${l}`));
  }

  // Needs attention
  const attentionItems=[
    ...urgentConts.map(l=>`⚠  ${l}`),
    ...blocked.map(l=>`🔴 BLOCKED: ${l}`),
    ...openRR.map(r=>`🔧 RR ${r.rrType||""}${r.item?" — "+r.item:""}${r.amount?" ($"+r.amount+")":""}${r.status?" — "+r.status:""}`),
    ...pendingCR.map(r=>`📄 CR Pending: ${r.contingency||"contingency"}${r.date?" — sent "+fmtShort(r.date):""}`)
  ];
  if(attentionItems.length){
    lines.push("");
    lines.push("NEEDS ATTENTION");
    lines.push("─────────────────────────────");
    attentionItems.forEach(l=>lines.push(l));
  }

  // Next steps
  if(nextSteps.length){
    lines.push("");
    lines.push("NEXT STEPS");
    lines.push("─────────────────────────────");
    nextSteps.forEach(l=>lines.push(`→  ${l}`));
  }

  lines.push("");
  lines.push("[Add any notes or questions here]");
  lines.push("");
  lines.push("Please let me know if you need anything.");
  lines.push("");
  lines.push("Best,");
  lines.push(LRG.tcName);
  lines.push(`TC | Landon Realty Group`);
  lines.push(LRG.tcEmail);

  const subject=`Transaction Update — ${addr}${coe!=="TBD"?" | COE "+coe:""}`;
  const body=lines.join("\n");

  // Open modal with editable preview
  const modal=document.createElement("div");
  modal.style.cssText="position:fixed;inset:0;background:rgba(50,40,20,.5);display:flex;align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(6px)";
  modal.innerHTML=`<div style="background:#faf7f2;border:1px solid #e0d8c8;border-radius:16px;padding:24px;width:600px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 40px rgba(0,0,0,.15)">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:#2a2010">Agent Update Email</span>
      <button id="au-close" style="background:none;border:none;color:#a09880;font-size:20px;cursor:pointer;line-height:1">×</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div>
        <label style="font-size:9px;color:#8a7a60;font-weight:700;letter-spacing:1.5px;display:block;margin-bottom:3px">TO</label>
        <input id="au-to" value="${esc(agEmail)}" placeholder="Agent email…" style="width:100%;background:#f5f0e8;border:1px solid #d8d0c0;border-radius:7px;padding:7px 10px;font-family:'Lato',sans-serif;font-size:12px;color:#3a3020"/>
      </div>
      <div>
        <label style="font-size:9px;color:#8a7a60;font-weight:700;letter-spacing:1.5px;display:block;margin-bottom:3px">SUBJECT</label>
        <input id="au-subject" value="${esc(subject)}" style="width:100%;background:#f5f0e8;border:1px solid #d8d0c0;border-radius:7px;padding:7px 10px;font-family:'Lato',sans-serif;font-size:12px;color:#3a3020"/>
      </div>
      <div>
        <label style="font-size:9px;color:#8a7a60;font-weight:700;letter-spacing:1.5px;display:block;margin-bottom:3px">MESSAGE — EDIT BEFORE SENDING</label>
        <textarea id="au-body" style="width:100%;min-height:260px;background:#f5f0e8;border:1px solid #d8d0c0;border-radius:7px;padding:10px 12px;font-family:'Lato',sans-serif;font-size:11px;color:#3a3020;line-height:1.6;resize:vertical">${esc(body)}</textarea>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button id="au-mailto" style="flex:1;background:#3a3020;color:#f5f0e8;border:none;border-radius:20px;padding:10px 20px;font-size:11px;font-family:'Lato',sans-serif;font-weight:700;cursor:pointer">✉ Open in Email App</button>
      <button id="au-copy" style="flex:1;background:transparent;color:#8a7a60;border:1px solid #d0c8b8;border-radius:20px;padding:10px 20px;font-size:11px;font-family:'Lato',sans-serif;font-weight:700;cursor:pointer">📋 Copy to Clipboard</button>
      <button id="au-close2" style="background:transparent;color:#a09880;border:1px solid #d0c8b8;border-radius:20px;padding:10px 16px;font-size:11px;font-family:'Lato',sans-serif;cursor:pointer">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(modal);

  const close=()=>document.body.removeChild(modal);
  modal.querySelector("#au-close").addEventListener("click",close);
  modal.querySelector("#au-close2").addEventListener("click",close);
  modal.addEventListener("click",e=>{if(e.target===modal)close();});

  modal.querySelector("#au-mailto").addEventListener("click",()=>{
    const to=encodeURIComponent(modal.querySelector("#au-to").value.trim());
    const subj=encodeURIComponent(modal.querySelector("#au-subject").value);
    const bd=encodeURIComponent(modal.querySelector("#au-body").value);
    window.location.href=`mailto:${to}?subject=${subj}&body=${bd}`;
  });

  modal.querySelector("#au-copy").addEventListener("click",()=>{
    const full=`To: ${modal.querySelector("#au-to").value}\nSubject: ${modal.querySelector("#au-subject").value}\n\n${modal.querySelector("#au-body").value}`;
    navigator.clipboard.writeText(full).then(()=>{
      const btn=modal.querySelector("#au-copy");
      btn.textContent="✓ Copied!";btn.style.background="#e8f4e8";btn.style.borderColor="#90c898";btn.style.color="#2a6a3a";
      setTimeout(()=>{btn.textContent="📋 Copy to Clipboard";btn.style.background="";btn.style.borderColor="";btn.style.color="";},2000);
    }).catch(()=>{
      // Fallback for browsers that block clipboard
      modal.querySelector("#au-body").select();document.execCommand("copy");
    });
  });

/* ── CHROME file:// FIX ──
   Chrome blocks onclick attributes injected via innerHTML when opened from file://.
   Solution: define bindOnclicks first, patch render/rMain/rSidebar BEFORE they run,
   then call load() and render() last so bindings are already in place. */
// ── GLOBAL CLICK DISPATCHER ──
// data-oc stores raw JS expression (single-quoted args, HTML-entity-encoded)
// data-action="open" data-id="..." for navigation
document.addEventListener('click', function(e){
  let el = e.target;
  for(let i=0; i<10 && el && el.tagName; i++){
    // data-action for file navigation
    if(el.dataset && el.dataset.action === 'open' && el.dataset.id){
      openFile(el.dataset.id); return;
    }
    // data-oc: raw JS expression stored in attribute
    if(el.hasAttribute && el.hasAttribute('data-oc')){
      // getAttribute gives us the HTML-decoded string (browser handles &quot; -> " automatically)
      const expr = el.getAttribute('data-oc');
      if(expr && expr !== 'null'){
        const s = document.createElement('script');
        s.textContent = 'try{' + expr + '}catch(_e){console.error("oc err:",' + JSON.stringify(expr) + ',_e)}';
        document.head.appendChild(s);
        document.head.removeChild(s);
      }
      return;
    }
    if('INPUT TEXTAREA SELECT'.includes(el.tagName)) return;
    el = el.parentElement;
  }
});

        <div style="display:flex;align-items:center;gap:8px">
          ${TODOS.length?`<span style="font-size:9px;color:#a09880">${TODOS.filter(t=>t.done).length}/${TODOS.length} done</span>`:""}
          ${TODOS.some(t=>t.done)?`<button data-oc="clearDoneTodos()" style="font-size:9px;color:#a07070;cursor:pointer;background:transparent;border:1px solid #d0b8b8;border-radius:20px;padding:2px 8px;font-family:'Lato',sans-serif;font-weight:700">✕ Clear done</button>`:""}
        </div>
      </div>
      ${TODOS.length?`<div style="padding:6px 0">${TODOS.map(t=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid #f0ebe0;background:${t.done?"#f8faf8":"#faf7f2"}">
        <input type="checkbox" style="width:14px;height:14px;accent-color:#8a7a50;cursor:pointer;flex-shrink:0" ${t.done?"checked":""} onchange="toggleTodo('${t.id}')"/>
        <span style="flex:1;font-size:12px;color:${t.done?"#a09880":"#3a3020"};text-decoration:${t.done?"line-through":"none"};line-height:1.4">${esc(t.text)}</span>
        <button data-oc="rmTodo('${t.id}')" style="background:none;border:none;color:#c0b8a8;cursor:pointer;font-size:15px;line-height:1;padding:0;flex-shrink:0">×</button>
      </div>`).join("")}</div>`:`<div style="padding:12px 16px;font-size:11px;color:#b0a890;font-style:italic">No tasks yet — add something below</div>`}
      <div style="display:flex;gap:8px;align-items:center;padding:10px 14px;background:#f5f0e8;border-top:1px solid #ece4d8">
        <input id="todo-input" class="fi" placeholder="Add a task…" onkeydown="if(event.key==='Enter'){event.preventDefault();addTodo();}" style="flex:1;font-size:12px"/>
        <button data-oc="addTodo()" style="background:#3a3020;color:#f5f0e8;border:none;border-radius:20px;padding:7px 16px;font-size:10px;font-family:'Lato',sans-serif;font-weight:700;cursor:pointer;white-space:nowrap">+ Add</button>
      </div>
    </div>`:""}
    
    <div style="font-size:9px;color:#b0a890;font-weight:700;letter-spacing:2px;margin-bottom:10px;margin-top:12px">${showClosed?"CLOSED & CANCELLED FILES":"ACTIVE FILES — SORTED BY COE"}</div>
    ${displayFiles.length===0?`<div style="text-align:center;padding:40px;color:#b0a890;font-style:italic;font-size:13px">${showClosed?"No closed files yet.":"No active files."}</div>`:""}
    ${cards.join("")}
  </div>`;

/* Deal-specific invoices; drafts sync as part of the transaction. */
function invoiceToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function invoiceNew(tx){return {number:'TC-'+String(tx.id).replace(/^tx_/,'')+'MH',date:invoiceToday(),issuedTo:'',reference:'',revision:1,issued:null,history:[]};}
function invoiceMoney(raw){
 const s=String(raw??'').trim().replace(/^\$\s*/,'');
 if(!/^(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d{1,2})?$/.test(s))return null;
 const n=Number(s.replace(/,/g,''));return Number.isFinite(n)&&n>0&&n<=9999999.99?Math.round(n*100):null;
}
function invoiceCurrency(cents){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(cents/100);}
function invoiceClients(tx){return [tx.clientLegalName||tx.client,...(tx.additionalClients||[]).map(c=>c.legalName||c.name)].filter(Boolean).join('\n');}
function invoiceData(tx){const i=tx.invoice||invoiceNew(tx);return {number:i.number,date:i.date,issuedTo:i.issuedTo,address:tx.address||'',clients:invoiceClients(tx),side:tx.represent==='seller'?'SELLER':'BUYER',amount:invoiceMoney(tx.tcFee?.amount),source:tx.tcFee?.source||'',reference:i.reference||'',revision:i.revision||1,payee:'Landon Realty Group',payeeAddress:'4004 W Riverside Drive\nBurbank, CA 91505',preparedBy:'Mia Hanada'};}
function invoiceMissing(tx){const d=invoiceData(tx);return [!d.address.trim()&&'property address',!d.clients.trim()&&'client name',d.amount===null&&'a valid TC fee',!d.source.trim()&&'fee source (RPA, BRBC, etc.)',!d.issuedTo.trim()&&'invoice recipient',!d.number.trim()&&'invoice number',!/^\d{4}-\d{2}-\d{2}$/.test(d.date)&&'issue date'].filter(Boolean);}
function invoiceCreate(id){const t=TXS.find(x=>x.id===id);if(!t||t.invoice)return;t.invoice=invoiceNew(t);save();rMain();}
function invoiceSet(id,key,value){const t=TXS.find(x=>x.id===id);if(!t?.invoice||t.invoice.issued)return;t.invoice[key]=value;save();invoiceRefreshPreview(t);}
function invoiceSetFee(id,key,value){const t=TXS.find(x=>x.id===id);if(!t||t.invoice?.issued)return;if(!t.tcFee)t.tcFee={};t.tcFee[key]=value;save();invoiceRefreshPreview(t);}
function invoiceRefreshPreview(t){const d=invoiceData(t),missing=invoiceMissing(t);const total=document.getElementById('inv-total'),status=document.getElementById('inv-status');if(total)total.textContent='Grand total: '+(d.amount===null?'Fee not entered':invoiceCurrency(d.amount));if(status)status.textContent=missing.length?'Complete before downloading: '+missing.join(', ')+'.':'Ready to download.';}
function invoiceRevise(id){const t=TXS.find(x=>x.id===id);if(!t?.invoice?.issued)return;const i=t.invoice;i.history=i.history||[];i.history.push(i.issued);i.issued=null;i.revision=(i.revision||1)+1;i.date=invoiceToday();save();rMain();}
function rInvoice(tx){
 const i=tx.invoice;
 if(!i)return `<div class="sec"><div class="sec-hdr"><span class="sec-title">Invoice</span></div><div class="sec-body"><p>New deals get an invoice draft automatically. Create a draft for this existing deal using its TC fee.</p><button class="btn-primary" data-oc="invoiceCreate('${tx.id}')">Create invoice draft</button></div></div>`;
 const locked=!!i.issued,d=i.issued||invoiceData(tx),missing=invoiceMissing(tx),disabled=locked?'disabled':'';
 const field=(label,key,value,type='text')=>`<div><label class="flabel" for="inv-${key}">${label}</label><input id="inv-${key}" class="fi" type="${type}" value="${esc(value)}" ${disabled} oninput="invoiceSet('${tx.id}','${key}',this.value)"/></div>`;
 return `<div class="sec"><div class="sec-hdr"><span class="sec-title">Invoice · ${locked?'Created':'Draft'}${i.revision>1?' · Revision '+i.revision:''}</span></div><div class="sec-body">
 <p style="font-size:12px;color:#70644f;line-height:1.6">Payable to Landon Realty Group · Prepared by Mia Hanada. Use the TC fee and payer documented for this deal. A draft is not a sent invoice.</p>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px">
 ${field('Invoice number','number',d.number)}${field('Date issued','date',d.date,'date')}${field('Issued to (name / company)','issuedTo',d.issuedTo)}
 <div><label class="flabel" for="inv-amount">TC fee for this deal</label><input class="fi" id="inv-amount" value="${esc(locked?invoiceCurrency(d.amount):tx.tcFee?.amount||'')}" ${disabled} placeholder="Enter documented fee" oninput="invoiceSetFee('${tx.id}','amount',this.value)"/></div>
 <div><label class="flabel" for="inv-source">Fee source</label><select class="fi" id="inv-source" ${disabled} onchange="invoiceSetFee('${tx.id}','source',this.value)"><option value="">Choose source</option>${['RPA','BRBC','ADM','Escrow Instructions','Listing Agreement','Other'].map(s=>`<option ${d.source===s?'selected':''}>${s}</option>`).join('')}</select></div>
 ${field('Document section / reference (internal)','reference',d.reference)}
 </div>
 <div style="margin-top:18px;padding:18px;border:1px solid #cbbba1;background:#fffcf6;border-radius:6px"><strong>TC Fee: ${esc(d.address||'Property not entered')}</strong><p style="white-space:pre-line">${d.side}: ${esc(d.clients||'Client not entered')}</p><strong id="inv-total">Grand total: ${d.amount===null?'Fee not entered':invoiceCurrency(d.amount)}</strong></div>
 <p id="inv-status" style="font-size:12px;color:#8a633a">${locked?'The downloaded invoice is saved as a fixed version. Start a revision if the deal details change.':missing.length?'Complete before downloading: '+esc(missing.join(', '))+'.':'Ready to download.'}</p>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn-primary" data-oc="invoiceDownload('${tx.id}')">${locked?'Download invoice PDF':'Create & download PDF'}</button>${locked?`<button class="btn-secondary" data-oc="invoiceRevise('${tx.id}')">Start revised draft</button>`:''}</div>
 ${(i.history||[]).length?`<p style="font-size:12px;margin-top:16px">Previous versions: ${(i.history||[]).map((v,n)=>`<button data-oc="invoiceDownload('${tx.id}',${n})">Revision ${v.revision}</button>`).join(' ')}</p>`:''}
 </div></div>`;
}
function invoicePdfText(s){return String(s??'').replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"');}
function invoiceBuildPdf(d){
 if(!window.jspdf)throw Error('PDF tools could not load. Check your connection and reload the tracker.');
 const pdf=new window.jspdf.jsPDF({unit:'pt',format:'letter'});
 pdf.setProperties({title:'Invoice '+d.number,author:'Mia Hanada',subject:'Transaction coordination fee'});
 const txt=(s,x,y,size=12,bold=false)=>{pdf.setFont('helvetica',bold?'bold':'normal');pdf.setFontSize(size);pdf.setTextColor(30,30,30);pdf.text(invoicePdfText(s),x,y);};
 if(typeof INVOICE_LOGO!=='undefined')pdf.addImage(INVOICE_LOGO,'JPEG',60,28,90,90);
 txt('INVOICE',60,162,36,true);txt(d.number,60,190,18);
 if(d.revision>1)txt('Revision '+d.revision,60,211,10);
 txt('Date issued:',365,86,13,true);txt(d.date,365,103,12);
 txt('Issued to:',365,137,13,true);
 pdf.setFontSize(12);const recipient=pdf.splitTextToSize(invoicePdfText(d.issuedTo),185);if(recipient.length>7)throw Error('Please shorten the invoice recipient to fit the PDF.');pdf.text(recipient,365,154);
 const x=[60,104,310,355,450,552],top=278,header=40;
 const desc='TC Fee:\n'+d.address+'\n\n'+d.side+':\n'+d.clients;
 pdf.setFont('helvetica','normal');pdf.setFontSize(12);const lines=pdf.splitTextToSize(invoicePdfText(desc),186);
 const bodyH=Math.max(206,lines.length*15+30);if(bodyH>320)throw Error('The property/client description is too long for one page. Please shorten it before creating the invoice.');
 const bottom=top+header+bodyH;
 pdf.setDrawColor(178,151,117);pdf.setLineWidth(.7);pdf.setFillColor(225,215,201);pdf.rect(60,top,492,header,'FD');pdf.rect(60,top+header,492,bodyH);pdf.rect(60,bottom,492,82);
 for(const col of x.slice(1,-1))pdf.line(col,top,col,bottom);
 ['NO','DESCRIPTION','QTY','PRICE','SUBTOTAL'].forEach((v,n)=>txt(v,x[n]+9,top+25,9,true));
 txt('1',78,top+66);pdf.setFont('helvetica','normal');pdf.setFontSize(12);pdf.text(lines,114,top+66);
 txt('1',329,top+66);txt(invoiceCurrency(d.amount),366,top+66,11);txt(invoiceCurrency(d.amount),462,top+66,11);
 txt('Payable to '+d.payee,72,bottom+24,12);txt(d.payeeAddress,80,bottom+46,11);
 txt('GRAND TOTAL',365,bottom+25,10,true);txt(invoiceCurrency(d.amount),472,bottom+25,12,true);
 pdf.setDrawColor(180,180,180);pdf.line(390,bottom+118,552,bottom+118);txt(d.preparedBy,421,bottom+137,12);
 return pdf;
}
function invoiceDownload(id,historyIndex){
 const t=TXS.find(x=>x.id===id);if(!t?.invoice)return;
 try{
  const historical=Number.isInteger(historyIndex),i=t.invoice;
  if(!historical&&!i.issued){const missing=invoiceMissing(t);if(missing.length){alert('Please complete: '+missing.join(', '));return;}
   if(TXS.some(other=>other.id!==id&&other.invoice?.number===i.number)){alert('That invoice number is already used by another deal. Please use a unique number.');return;}
  }
  const d=historical?i.history[historyIndex]:i.issued||invoiceData(t);if(!d)return;
  const pdf=invoiceBuildPdf(d);
  pdf.save(('Invoice-'+d.number+(d.revision>1?'-R'+d.revision:'')+'.pdf').replace(/[^a-zA-Z0-9._-]/g,'-'));
  if(!historical&&!i.issued){i.issued={...d,createdAt:new Date().toISOString()};if(t.milestones?.tc_invoice_created)t.milestones.tc_invoice_created.status='done';save();rMain();rSidebar();}
 }catch(e){alert('Invoice could not be created: '+e.message);}
}

function cloudBackup(){const raw=localStorage.getItem(SK);if(raw)localStorage.setItem(SK+'_before_cloud_'+Date.now(),raw);}
function cloudRemember(revision,base){cloudMeta={revision,base,user:cloudUser.id};localStorage.setItem(CLOUD_META,JSON.stringify(cloudMeta));}
function cloudUnlock(){cloudReady=true;cloudConflict=false;cloudMessage('Private cloud · mia@lrgla.com', [['Sync now',()=>cloudSync()],['Sign out',cloudSignOut]]);}
function cloudFail(error){cloudStatus('● saved on this device');cloudMessage('Cloud unavailable. Your changes are saved on this device. '+error.message,[['Retry',()=>cloudStart()]]);}
function cloudChoose(remote){
  cloudReady=false;cloudConflict=true;
  cloudMessage('This device and the cloud have different versions. Export a backup before choosing which version to use.',[
    ['Export this device',exportData],
    ['Use cloud version',()=>{if(!confirm('Use the cloud version? A copy of this device’s version will be kept locally.'))return;cloudBackup();const raw=JSON.stringify(remote.value);localStorage.setItem(SK,raw);cloudRemember(remote.revision,raw);load();render();cloudUnlock();cloudStatus('● synced');}],

  ]);

async function cloudRead(){const {data,error}=await cloudClient.from('tracker_data').select('value,revision').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;return data;}
async function cloudStart(){
  if(cloudBusy)return;
  cloudBusy=true;cloudReady=false;
  try{
    const {data,error}=await cloudClient.auth.getSession();if(error)throw error;
    cloudUser=data.session?.user;
    if(!cloudUser){cloudMessage('Saved on this device. Sign in to sync across your phone, laptop and iPad.',[['Sign in with password',cloudSignIn]]);return;}
    if(cloudUser.email?.toLowerCase()!=='mia@lrgla.com'){cloudMessage('Please sign in as mia@lrgla.com.',[['Sign out',cloudSignOut]]);return;}
    const stored=JSON.parse(localStorage.getItem(CLOUD_META)||'null');cloudMeta=stored?.user===cloudUser.id?stored:{revision:null,base:null};
    const before=localStorage.getItem(SK);
    const remote=await cloudRead();
    const local=localStorage.getItem(SK);
    if(local!==before){cloudMessage('Local changes are saved. Tap Retry to finish connecting.',[['Retry',cloudStart]]);return;}
    if(!remote){
      cloudMessage('Your private cloud is empty. Start on the device that has your latest tracker entries.',[['Upload this device’s tracker',async()=>{
        if(!confirm('Upload this device’s tracker to your private TC Tracker database in Supabase?'))return;
        try{cloudBackup();cloudRemember(null,null);cloudUnlock();await cloudSync();}catch(e){cloudFail(e);}
      }]]);return;
    }
    const remoteRaw=JSON.stringify(remote.value);
    // PostgreSQL JSONB key order differs; compare parsed values canonically.
    if(!local||cloudEqual(local,cloudMeta.base)||cloudEqual(local,remoteRaw)){
      if(local&&!cloudEqual(local,remoteRaw))cloudBackup();
      localStorage.setItem(SK,remoteRaw);cloudRemember(remote.revision,remoteRaw);load();render();cloudUnlock();cloudStatus('● synced');
    }else if(remote.revision===cloudMeta.revision){cloudUnlock();setTimeout(cloudSync,0);}
    else cloudChoose(remote);
  }catch(e){cloudFail(e);}finally{cloudBusy=false;}
}
function cloudCanonical(v){if(Array.isArray(v))return v.map(cloudCanonical);if(v&&typeof v==='object')return Object.fromEntries(Object.keys(v).sort().map(k=>[k,cloudCanonical(v[k])]));return v;}
function cloudEqual(a,b){if(a===null||b===null)return a===b;try{return JSON.stringify(cloudCanonical(JSON.parse(a)))===JSON.stringify(cloudCanonical(JSON.parse(b)));}catch{return false;}}
async function cloudSync(){
  if(!cloudReady||cloudBusy||cloudConflict||!cloudUser)return;
  cloudBusy=true;
  try{
    const raw=localStorage.getItem(SK);if(!raw)return;
    if(cloudEqual(raw,cloudMeta.base)){cloudBusy=false;await cloudStart();return;}
    cloudStatus('● syncing…');
    const value=JSON.parse(raw);const next=(cloudMeta.revision||0)+1;
    const row={user_id:cloudUser.id,value,revision:next,updated_at:new Date().toISOString()};
    let result;
    if(cloudMeta.revision===null)result=await cloudClient.from('tracker_data').insert(row).select('revision');
    else result=await cloudClient.from('tracker_data').update(row).eq('user_id',cloudUser.id).eq('revision',cloudMeta.revision).select('revision');
    if(result.error){if(result.error.code==='23505'){const remote=await cloudRead();cloudChoose(remote);return;}throw result.error;}
    if(!result.data?.length){const remote=await cloudRead();if(remote)cloudChoose(remote);else throw Error('Cloud record missing; reconnect to restore it.');return;}
    cloudRemember(next,raw);cloudStatus(cloudEqual(localStorage.getItem(SK),raw)?'● synced':'● saved on this device');
    if(!cloudEqual(localStorage.getItem(SK),raw))setTimeout(cloudSync,0);
  }catch(e){cloudFail(e);}finally{cloudBusy=false;}
}
